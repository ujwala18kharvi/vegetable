<body>

<header>
    <div class="header-content">

        <img src="logo2.png" class="logo">

<nav>

</nav>

<div class="buy-box">

    <div class="product">
        <img id="productImage">

        <h2 id="productName"></h2>

     <div class="quantity-price">

    <div>
        <label>Quantity:</label>
        <input type="number" id="buyQuantity" value="1" min="1"
               oninput="changeQuantity()" class="quantity-box">
    </div>

    <p class="price" id="totalPrice"></p>

</div>
    </div>

    <label>Full Name:</label>
    <input type="text" id="customerName" placeholder="Enter your name">

    <label>Address:</label>
    <input type="text" id="address" placeholder="Enter your address">

    <label>Phone Number:</label>
    <input type="text" id="phone" placeholder="Enter phone number">

    <label>Payment Method:</label>

    <select id="payment">
        <option value="">Select Payment Method</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="UPI">UPI</option>
    </select>

    <button class="place-order" onclick="placeOrder()">
        Place Order
    </button>

</div>

<div id="successMessage">
    <span>✓</span>
    Order placed successfully!
</div>

<script>

let params = new URLSearchParams(window.location.search);

let name = params.get("name");
let price = Number(params.get("price"));
let image = params.get("image");
let quantity = Number(params.get("quantity"));

if (!quantity || quantity < 1) {
    quantity = 1;
}

document.getElementById("productName").innerHTML = name;
document.getElementById("productImage").src = image;

document.getElementById("buyQuantity").value = quantity;


/* CHANGE QUANTITY FUNCTION */
function changeQuantity() {

    let newQuantity =
        Number(document.getElementById("buyQuantity").value);

    if (newQuantity < 1) {
        newQuantity = 1;
        document.getElementById("buyQuantity").value = 1;
    }

    document.getElementById("totalPrice").innerHTML =
        "Total Price: ₹" + (price * newQuantity);
}


/* SHOW PRICE WHEN PAGE FIRST OPENS */
changeQuantity();
function placeOrder() {

    let customerName =
        document.getElementById("customerName").value.trim();

    let address =
        document.getElementById("address").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let payment =
        document.getElementById("payment").value;

    let message =
        document.getElementById("successMessage");

    if (customerName === "" ||
        address === "" ||
        phone === "" ||
        payment === "") {

        message.innerHTML =
            "⚠ Please fill all the details first!";

        message.style.color = "red";
        message.style.display = "block";

        return;
    }

    message.innerHTML =
        "<span>✓</span> Order placed successfully!";

    message.style.color = "green";
    message.style.display = "block";
}

</script>
