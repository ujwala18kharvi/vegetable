<!DOCTYPE html>
<html>
<head>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4fff0;
        }

        header {
            background-color: green;
            color: white;
            text-align: center;
            padding: 30px;
        }
         .brand{
           margin:0;
           padding:0;
           text-align:left;
          }
         .brand h1{
            margin:0;
            font-size:28px;
            line-height:1.1;
            white-space:nowrap;
        }
         .brand h1 span{
           color:#fff176;
           }
         .brand p{
           font-size:15px;
           margin:4px 0 0;
           text-align:left;
           padding-left:80px;
           width:100%;
          }
        .header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    padding-left:60px;
   
}
 header p {
    text-align: left;
    padding-left:230px;
}


        .logo {
            width: 80px;
            height: 80px;
            
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        

        /* Navigation */
        nav {
            background-color: darkgreen;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        /* Home Banner */
        .home-banner {
            width: 100%;
            height: 580px;
            position: relative;
            overflow: hidden;
        }

        .home-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Text on image */
        .banner-content {
            position: absolute;
            top: 62%;
            left: 19%;
            transform: translateY(-50%);
            color: darkgreen;
            text-align: center;
        }

        .banner-content h2 {
            font-size: 45px;
            margin: 0;
        }

        .banner-content p {
            font-size: 22px;
            margin: 10px 0 20px;
        }

        /* Shop Now */
        .shop-button {
            display: inline-block;
            background-color: #17385f;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        .shop-button:hover {
            background-color: green;
        }

        /* Features */
        .features {
            display: flex;
            justify-content: center;
            gap: 70px;
            padding: 25px;
            background-color: white;
        }

        .feature {
            text-align: center;
            color: darkgreen;
        }

        .feature h3 {
            margin: 5px 0;
        }

        .feature p {
            margin: 0;
        }

        /* Footer */
        footer {
            background-color: green;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>
</head>
