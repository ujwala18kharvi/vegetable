<!DOCTYPE html>
<html>
<head>
    <title>Fresh Vegetable Store</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4fff0;
        }

        /* Header */
        header {
            background-color: green;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .brand {
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
            white-space: nowrap;
        }

        .brand h1 span {
            color: #fff176;
        }

        .brand p {
            font-size: 15px;
            margin: 4px 0 0;
            text-align: left;
            padding-left: 80px;
            width: 100%;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding-left: 60px;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        /* Navigation */
        nav {
            background-color: darkgreen;
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-size: 18px;
        }

        /* Home Banner */
        .home-banner {
            width: 100%;
            height: 580px;
            position: relative;
            overflow: hidden;
        }

        .home-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Text on image */
        .banner-content {
            position: absolute;
            top: 62%;
            left: 19%;
            transform: translateY(-50%);
            color: darkgreen;
            text-align: center;
        }

        .banner-content h2 {
            font-size: 45px;
            margin: 0;
        }

        .banner-content p {
            font-size: 22px;
            margin: 10px 0 20px;
        }

        /* Shop Now */
        .shop-button {
            display: inline-block;
            background-color: #17385f;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        .shop-button:hover {
            background-color: green;
        }

        /* Features */
        .features {
            display: flex;
            justify-content: center;
            gap: 70px;
            padding: 25px;
            background-color: white;
        }

        .feature {
            text-align: center;
            color: darkgreen;
        }

        .feature h3 {
            margin: 5px 0;
        }

        .feature p {
            margin: 0;
        }

        /* Footer */
        footer {
            background-color: green;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Tablet Responsive */
        @media screen and (max-width: 768px) {

            header {
                padding: 20px 10px;
            }

            .header-content {
                padding-left: 0;
                justify-content: center;
                gap: 10px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            .brand h1 {
                font-size: 22px;
                white-space: normal;
            }

            .brand p {
                padding-left: 0;
                font-size: 13px;
                text-align: center;
            }

            nav {
                padding: 10px;
                gap: 5px;
            }

            nav a {
                margin: 5px;
                font-size: 16px;
            }

            .home-banner {
                height: 400px;
            }

            .banner-content {
                left: 10%;
                top: 65%;
            }

        }

        /* Mobile Responsive */
        @media screen and (max-width: 480px) {

            header {
                padding: 18px 8px;
            }

            .header-content {
                padding-left: 0;
                gap: 8px;
                justify-content: center;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            .brand h1 {
                font-size: 17px;
                white-space: normal;
            }

            .brand p {
                font-size: 11px;
                padding-left: 0;
                text-align: center;
            }

            nav {
                padding: 10px 5px;
                gap: 5px;
            }

            nav a {
                font-size: 14px;
                margin: 5px;
            }

            .home-banner {
                height: 300px;
            }

            .home-banner img {
                object-fit: cover;
            }

            .banner-content {
                left: 50%;
                top: 65%;
                transform: translate(-50%, -50%);
                width: 90%;
            }

            .banner-content h2 {
                font-size: 25px;
            }

            .banner-content p {
                font-size: 15px;
            }

            .shop-button {
                padding: 10px 20px;
                font-size: 15px;
            }

            .features {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            footer {
                padding: 12px;
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="header-content">

        <img src="logo2.png" class="logo">

        <div class="brand">

            <h1>🥕<span> Fresh Vegetable Store</span> 🥦</h1>

            <p>Fresh Vegetables at Best Prices</p>

        </div>

    </div>

</header>

<nav>

    <a href="index.html">Home</a>
    <a href="vegetable1.html">Vegetables</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">🛒 My Cart</a>

</nav>

<!-- Home Banner -->

<div class="home-banner">

    <img src="fresh.jpeg">

    <div class="banner-content">

        <a href="vegetable1.html" class="shop-button">
            Shop Now
        </a>

    </div>

</div>

<!-- Footer -->

<footer>

    <p>© 2026 Fresh Vegetable Store</p>

</footer>

</body>
</html>
