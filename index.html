<!DOCTYPE html>
<html>
<head>
    <title>Fresh Vegetable Store</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4fff0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background-color: green;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            gap: 20px;
        }

        header img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
        }

        .header-text {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            color: yellow;
        }

        header p {
            margin: 8px 0 0;
            font-size: 18px;
        }

        /* NAVIGATION */

        nav {
            background-color: darkgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 12px 15px;
        }

        nav a:hover {
            background-color: green;
        }

        /* MAIN CONTENT */

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* HOME BANNER */

        .home-banner {
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .home-banner img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* SHOP NOW BUTTON */

        .shop-button {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #153873;
            color: white;
            padding: 18px 35px;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
        }

        .shop-button:hover {
            background-color: green;
        }

        /* FOOTER */

        footer {
            background-color: green;
            color: white;
            text-align: center;
            padding: 30px 10px;
            font-size: 22px;
            margin-top: auto;
            width: 100%;
            flex-shrink: 0;
        }

        /* TABLET RESPONSIVE */

        @media screen and (max-width: 768px) {

            header {
                padding: 20px 10px;
            }

            header h1 {
                font-size: 25px;
            }

            nav a {
                font-size: 18px;
                padding: 10px;
            }

        }

        /* MOBILE RESPONSIVE */

        @media screen and (max-width: 480px) {

            header {
                padding: 15px 8px;
                gap: 10px;
            }

            header img {
                width: 75px;
                height: 75px;
            }

            header h1 {
                font-size: 22px;
            }

            header p {
                font-size: 15px;
            }

            nav {
                padding: 8px 3px;
            }

            nav a {
                font-size: 16px;
                padding: 10px 8px;
            }

            .home-banner {
                width: 100%;
                height: auto;
            }

            .home-banner img {
                width: 100%;
                height: auto;
                object-fit: contain;
            }

            .shop-button {
                font-size: 16px;
                padding: 12px 22px;
            }

            footer {
                padding: 30px 10px;
                font-size: 18px;
            }

        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <img src="images/logo2.png" alt="Fresh Vegetable Logo">

        <div class="header-text">

            <h1>🥕 Fresh Vegetable Store 🥦</h1>

            <p>Fresh Vegetables at Best Prices</p>

        </div>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <a href="index.html">Home</a>

        <a href="vegetable1.html">Vegetables</a>

        <a href="about.html">About Us</a>

        <a href="contact.html">Contact</a>

        <a href="cart.html">🛒 My Cart</a>

    </nav>


    <!-- MAIN CONTENT -->

    <main>

        <div class="home-banner">

            <img src="images/fresh.jpeg" alt="Fresh Vegetables">

            <a href="vegetable1.html" class="shop-button">
                Shop Now
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Fresh Vegetable Store

    </footer>

</body>
</html>
